shell = "zsh"

apply = ["defer"]

[templates]
defer = "{{ hooks | get: \"pre\" | nl }}{% for file in files %}zsh-defer -a -t0.01 source \"{{ file }}\"\n{% endfor %}{{ hooks | get: \"post\" | nl }}"
defer0 = "{{ hooks | get: \"pre\" | nl }}{% for file in files %}zsh-defer -a source \"{{ file }}\"\n{% endfor %}{{ hooks | get: \"post\" | nl }}"

[plugins]

####################
# eager
####################

[plugins.zsh-defer]
github = "romkatv/zsh-defer"
apply = ["source"]
profiles = ["eager"]

[plugins.starship]
inline = """
eval "$(starship init zsh)"
"""
profiles = ["eager"]

[plugins.lazy]
local = "~/.config/zsh"
use = ["lazy.zsh"]
profiles = ["eager"]

####################
# lazy
####################

[plugins.zsh-completions]
github = "zsh-users/zsh-completions"
dir = "src"
apply = ["fpath"]
profiles = ["lazy"]

[plugins.zsh-autosuggestions]
github = "zsh-users/zsh-autosuggestions"
profiles = ["lazy"]

[plugins.zsh-history-substring-search]
github = "zsh-users/zsh-history-substring-search"
hooks.post = """
bindkey "${terminfo[kcuu1]}" history-substring-search-up   # arrow-up
bindkey "${terminfo[kcud1]}" history-substring-search-down # arrow-down
bindkey "^[[A" history-substring-search-up   # arrow-up
bindkey "^[[B" history-substring-search-down # arrow-down
"""
profiles = ["lazy"]

[plugins.fast-syntax-highlighting]
github = "zdharma-continuum/fast-syntax-highlighting"
profiles = ["lazy"]

[plugins.mise]
inline = """
eval "$(mise activate zsh)"
"""
profiles = ["lazy"]

[plugins.zsh-replace-multiple-dots]
github = "momo-lab/zsh-replace-multiple-dots"
hooks.post = """
replace_multiple_dots_exclude_go() {
    if [[ "$LBUFFER" =~ '^go ' ]]; then
        zle self-insert
    else
        zle .replace_multiple_dots
    fi
}
zle -N .replace_multiple_dots replace_multiple_dots
zle -N replace_multiple_dots replace_multiple_dots_exclude_go
"""
profiles = ["lazy"]

[plugins.direnv]
local = "~/.local/share/gh-red/packages/github.com/direnv/direnv"
profiles = ["lazy"]

[plugins.zsh-autopair]
github = "hlissner/zsh-autopair"
profiles = ["lazy"]

# programs
[plugins.forgit]
github = "wfxr/forgit"
dir = "bin"
apply = ["path"]
profiles = ["lazy"]

# local
[plugins.compinit]
inline = """
autoload -Uz compinit
# Run a full security-checked compinit at most once a day and use the
# cached zcompdump (-C) the rest of the time so new shells stay snappy.
__compinit() {
    local dump="$XDG_STATE_HOME/zcompdump"
    if [[ -n "$dump"(#qN.mh-24) ]]; then
        compinit -C -d "$dump"
    else
        compinit -d "$dump"
    fi
}
zsh-defer -a -t0.01 __compinit
"""
profiles = ["lazy"]
