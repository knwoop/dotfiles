set-option -g prefix C-q

set -g  default-terminal "tmux-256color"
set -ga terminal-overrides ",$TERM:Tc"
set -ga terminal-features ",*:RGB:sync"
set -g  default-shell "${SHELL}"
set -g  history-limit 10000
set -g  escape-time 10
set -g  base-index 1
set -g  pane-base-index 1

# Let escape sequences pass through to the nested tmux / terminal for TUIs.
set -g  allow-passthrough on

# status bar
set -g status-style fg="colour251",bg="colour236"
# No session name or window list on the left: the session picker says where
# I am, and windows are rarely more than one.
set -g status-left ""
set -g status-right "#[fg=colour215]#(\"$XDG_CONFIG_HOME/tmux/awake.bash\" status)#[fg=colour238]\ue0b2#[fg=colour251,bg=colour238] \uf073 %Y/%m/%d #[fg=colour245]\ue0b3#[fg=colour147] \ue384 %H:%M:%S #[default]"
set -g window-status-format ""
set -g window-status-current-format ""
set -g window-style "bg=colour236"
set -g window-active-style "bg=terminal"

# set the status bar position
set -g status-position bottom
set -g status-interval 1

# pane border: a plain line between panes, no label on it
set -g pane-border-status off
set -g pane-border-lines single

# enable mouse controll
set -g mouse on

# use emacs key bindings in copy-mode
set-window-option -g mode-keys emacs

# key bindings
bind r source-file "$XDG_CONFIG_HOME/tmux/tmux.conf" \; display "config reloaded"

bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind C-w kill-window
bind -r n next-window
bind -r p previous-window
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind Space copy-mode
bind / copy-mode \; command-prompt -p "(search down)" "send -X search-forward \"%%%\""
bind C-u copy-mode \; send -X search-forward "(https?://|git@|git://|ssh://|ftp://|file:///)[[:alnum:]?=%/_.:,;~@!#$&()*+-]*"
bind C-i copy-mode \; send -X search-forward "[[:digit:]]{1,3}\.[[:digit:]]{1,3}\.[[:digit:]]{1,3}\.[[:digit:]]{1,3}"

# popup
bind g popup -w90% -h90% -E lazygit
# A dark background of its own: the popup otherwise takes on a pale grey that
# leaves the rows not under the cursor hard to read. No popup border (-B):
# fzf draws its own, and two nested frames are one too many.
bind s display-popup -E -B -w 95% -h 95% -s bg=colour234 "$XDG_CONFIG_HOME/tmux/session-picker.bash"
# Toggle keeping the Mac awake (caffeinate -i -s); "☕ awake" shows while on.
bind a run-shell "\"$XDG_CONFIG_HOME/tmux/awake.bash\" toggle"
# Keep the picker's open order across server restarts.
set-hook -g client-attached        "run-shell '\"$XDG_CONFIG_HOME/tmux/session-opened.bash\" opened #{q:session_name}'"
set-hook -g client-session-changed "run-shell '\"$XDG_CONFIG_HOME/tmux/session-opened.bash\" opened #{q:session_name}'"
set-hook -g session-created        "run-shell '\"$XDG_CONFIG_HOME/tmux/session-opened.bash\" created #{q:session_name}'"

# plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# initialize tpm (keep this line at the very bottom of tmux.conf)
run "$HOME/.local/share/tmux/plugins/tpm/tpm"
